<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>
            <h1 class="logo">
               <i data-lucide="notebook"></i>
               Notes App
            </h1>
        </div>
        

        <div class="header-actions">

            <i data-lucide="search"></i>

            <input
              type="text"
              id="searchInput"
              placeholder="Search notes..."
            >

            <!-- dark mode -->
            <button id="themeBtn">

            <i data-lucide="moon"></i>

            </button>
             
        </div>        

    </header>

    <main>

        <section class="input-section">

            <div class="input-box">

               <textarea
                  id="noteInput"
                  placeholder="Write your note...">
               </textarea>

               <div class="input-actions">

                  <button id="addBtn">Add Note</button>

                 <button id="colorBtn">
                    <i data-lucide="palette"></i>
                    Color
                 </button>

                 <div class="color-picker">
                     <button class="color-option" data-color="#fef3c7"></button>
                     <button class="color-option" data-color="#dcfce7"></button>
                     <button class="color-option" data-color="#dbeafe"></button>
                     <button class="color-option" data-color="#f3e8ff"></button>
                     <button class="color-option" data-color="#fee2e2"></button>
                 </div>

               </div>
              
            </div>
        </section>


        <div id="emptyState"></div>   

        <section class="pinned-section">

            <h2>Pinned Notes <span id="pinnedCount">0</span></h2>

            <div id="pinnedNotesContainer" class="notes-container">

            </div>

        </section>

        <section class="all-notes-section">

            <h2>All Notes <span id="allNotesCount">0</span></h2>

            <div id="allNotesContainer" class="notes-container">

            </div>

        </section>

    </main>

    <div id="toastContainer"></div>

    
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="script.js"></script>
</body>
</html>
